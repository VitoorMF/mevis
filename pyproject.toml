[project]
name = "trader"
version = "0.1.0.dev0"
description = "Sistema de trading algorítmico com IA — V0.1 Data Engine"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.43.118",
    "httpx>=0.28.1",
    "pyarrow>=26.0.0",
    "websockets>=17.3",
    "zstandard>=0.25.0",
]

[project.scripts]
trader = "trader.cli.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/trader"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["trader", "conftest"]

[tool.mypy]
strict = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = [
    "pyarrow", "pyarrow.*", "boto3", "boto3.*", "botocore", "botocore.*",
    "sklearn", "sklearn.*", "scipy", "scipy.*",
]
ignore_missing_imports = true

[dependency-groups]
dev = [
    "botocore[crt]>=1.43.118",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "ruff>=0.17.2",
]
pesquisa = [
    "numpy>=2.5.4",
    "scikit-learn>=1.9.1",
    "xgboost>=3.4.1",
]

[tool.uv]
# O grupo `pesquisa` (numpy, DEC-34; xgboost e scikit-learn, DEC-41) fica fora do artefato do host até a V0.3 (RNF-029).
default-groups = ["dev", "pesquisa"]
